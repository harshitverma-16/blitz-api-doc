site_name: Blitz API Documentation

theme:
  name: material
  favicon: favicon.ico
  logo: icon.png
  features:
    - navigation.expand
    - content.code.copy
    - navigation.sections
    - navigation.tracking
    - toc.follow


  copyright: "this is copyright"

extra_css:
  - css/custom.css

  
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:                # built-in Markdown TOC extension
      permalink: true
      toc_depth: 3

nav:

  - Introduction: index.md
  - Authentication: Authentication.md
  - Trading APIs:
    - Orders : orders.md
    - Trades : trades.md
    - Positions : positions.md
  

  - Market Data APIs:
    - Last Trading Price: LTP.md
    - Option Chain: optionchain.md
    - Market Quote: marketquote.md
    - Historical Data: historicaldata.md

  - SDK: sdk.md
  